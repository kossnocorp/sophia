# Python

id: python

layers:
  runtime:
    effect:
      # >>print<<("Hello, World!")
      - meta.function-call.python meta.function-call.generic.python
      - support.function.builtin.python
      # >>cls<<(name="anonymous", identifier=identifier, active=False)
      - variable.language.special.cls.python
      # total >>/<< len(numbers)
      - keyword.operator.arithmetic.python

    control:
      # *async* def prompt(...):
      - storage.type.function.async.python
      # def wrapper(>>*<<args: Any, >>**<<kwargs: Any) -> T:
      - keyword.operator.unpacking.parameter.python
      # func(>>*<<args, >>**<<kwargs)
      - keyword.operator.unpacking.arguments.python

    declare:
      # def *interpolate_prompt*(...
      - function:
          - declaration
      # class *CollectionBase*:
      - class:
        - declaration
      # def *data*(...):
      - entity.name.function.python
      - method:
        - declaration
      # def classify(>>value<<: object) -> str:
      - variable.parameter.function.language.python
      # >>MAX_RETRIES<<: Final = 3
      - variable:
        - definition

    magic-declare:
      # def display_name(>>self<<) -> str:
      - variable.parameter.function.language.special.self.python
      # def anonymous(>>cls<<, identifier: T) -> User[T]:
      - variable.parameter.function.language.special.cls.python

    access:
      # print(f"{>>prefix<<}: {>>total<<:,}")
      # func(>>args<<)
      - meta.function-call.python meta.function-call.arguments.python
      # self.>>identifier<<
      - meta.member.access.python
      # >>self<<.config['token']
      - variable.language.special.self.python
      # >>mapping<<["answer"]
      - meta.item-access.python

    magic-access:
      # if >>__name__<< == "__main__":
      - support.variable.magic.python

    namespace-access:
      # from >>pathlib<< import Path
      - namespace: true

    detail:
      # class CollectionBase*(*Model*)*:
      - punctuation.definition.inheritance.begin.python
      - punctuation.definition.inheritance.end.python
      # class CollectionV1(CollectionBase*,* Model):
      - punctuation.separator.inheritance.python
      # class CollectionV1(CollectionBase, Model)*:*
      - punctuation.section.class.begin.python
      # def interpolate_string(...)*:*
      - punctuation.section.function.begin.python
      # def interpolate_string(messages*,* ...)
      - punctuation.separator.parameters.python
      # payload*:* str
      - punctuation.separator.colon.python
      # package: Optional*[*PackageSettings*]* = None
      - punctuation.definition.arguments.begin.python
      - punctuation.definition.arguments.end.python
      # Dict[str*,* Any]
      - punctuation.separator.element.python
      # hello("cruel"*,* "world")
      - punctuation.separator.arguments.python
      # return *(* ... *)*
      - punctuation.parenthesis.begin.python
      - punctuation.parenthesis.end.python
      # hello*.*world
      - meta.function-call.python punctuation.separator.period.python
      - meta.member.access.python punctuation.separator.period.python

  data:
    control:
      # *f*"Bearer {self.config['token']}"
      - string.interpolated.python storage.type

    primitive:
      # from *genotype* import Model
      - module: true

    detail:
      # return *[* ... *]*
      - punctuation.definition.list.begin.python
      - punctuation.definition.list.end.python
      # return *{* ... *}*
      - punctuation.definition.dict.begin.python
      - punctuation.definition.dict.end.python
      # { hello*:* "world" }
      - punctuation.separator.dict.python

    property:
      # field(>>default_factory<<=list)
      - variable.parameter.function-call.python

    embed:
      # f"Bearer >>{<<self.config['token']>>}<<"
      - constant.character.format.placeholder.other.python

  types:
    base:
      # time: *int*
      - class:
          - typeHint
      # whatever: *Dict*[str, Any]
      - variable:
          - typeHint
      # nothing: *None*
      - builtinConstant:
          - typeHint

    detail:
      # def interpolate_string(...) *->* str:
      - punctuation.separator.annotation.result.python
      # def interpolate_string(prompt*:* str, ...)
      - punctuation.separator.annotation.python

    runtime-declare:
      # class >>User<<(Generic[T]):
      - entity.name.type.class.python

    runtime-access:
      # from collections.abc import >>AsyncIterator<<
      # >>range<<(-2, 5)
      - class: true
      # async def main() -> >>None<<:
      - builtinConstant: true

    generic-access:
      # class User(Generic[>>T<<]):
      # identifier: >>T<<
      - typeParameter: true

    annotation-access:
      # name: >>str<<
      - support.type.python
      # def wrapper(*args: >>Any<<, **kwargs: >>Any<<) -> T:
      - meta.function.parameters.python
      # except (>>KeyError<<, >>ZeroDivisionError<<) as error:
      - support.type.exception.python

  macro:
    decorate:
      # @>>dataclass<<
      - entity.name.function.decorator.python
      - meta.function.decorator.python support.type.python

  comments:
    base:
      # """*Collection payload.*"""
      - string.quoted.docstring

    detail:
      # *"""*Collection payload.*"""*
      - string.quoted.docstring.multi.python punctuation.definition.string.begin.python
      - string.quoted.docstring.multi.python punctuation.definition.string.end.python

    doc-content:
      # """>>Collection payload.<<"""
      - string.quoted.docstring.multi.python
      - string:
        - documentation