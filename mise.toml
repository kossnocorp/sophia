[tools]
# Stack
node = "latest"
pnpm = "latest"

# Tools
fnox = "latest"
jaq = "latest"

[settings]
# Enable extra features
experimental = true
# Consume Node.js version from .nvmrc, .tool-versions, etc.
idiomatic_version_file_enable_tools = ["node"]

[tasks.dev]
run = "node --watch ./build.mjs --watch"

[tasks.build]
run = "node ./build.mjs"

[tasks."publish"]
run = "./scripts/publish.sh"
